<!-- MODAL: ACCIONES SOBRE AUTOMATISMOS -->
<div id="automation-actions-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="width: 400px;">
        <h3>Acciones sobre Automatismos</h3>
        <p id="automation-actions-message" style="font-size: 14px; margin-bottom: 25px;"></p>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <button id="automation-actions-activate-btn" class="action-button activate-btn">Activar</button>
            <button id="automation-actions-run-btn" class="action-button">Ejecutar</button>
            <button id="automation-actions-stop-btn" class="action-button delete-btn">Parar</button>
        </div>
        <div class="modal-actions" style="margin-top: 25px;">
            <button id="automation-actions-cancel-btn" class="action-button cancel-btn">Cancelar</button>
        </div>
    </div>
</div>

<!-- 10. SECCIÓN: GESTIÓN DE AUTOMATISMOS -->
<div id="gestion-automatismos-section" class="section">
    <div class="section-header">
        <button class="back-button">← Atrás</button>            
        <div class="header-actions">
            <button id="refreshAutomationsTableBtn" class="action-button">Refrescar</button>
            <button id="analyzeAutomationBtn" class="action-button" disabled>Analizar</button>
            <button id="getNotificationsBtn" class="action-button">Cargar Notificaciones</button>
            <button id="downloadAutomationsCsvBtn" class="action-button">Exportar</button>
            <button id="actionsAutomationBtn" class="action-button delete-btn" disabled>Acciones</button>
            <button id="cloneAutomationBtn" class="action-button" disabled>Clonar</button>            
        </div>
    </div>
    <h2>Gestión de Automatismos <span id="automationCount" style="color: #558ac7; font-weight: normal; font-size: 0.9em;"></span></h2>
    <!-- Filtros para la tabla de automatismos -->
    <div class="header-filters">
        <input type="text" id="automationNameFilter" class="filter-input" placeholder="Buscar por nombre...">
        <select id="automationStatusFilter" class="filter-input">
            <option value="">Todos los estados</option>
        </select>
        <select id="automationJourneyFilter" class="filter-input">
            <option value="">Todos (Lanza Journey)</option>
            <option value="yes">Lanza Journey</option>
            <option value="no">No lanza Journey</option>
        </select>
        <select id="automationDateField" class="filter-input">
            <option value="">Fecha (todos)</option>
            <option value="lastRunTime">Última Ejecución</option>
            <option value="scheduledTime">Próxima Ejecución</option>
        </select>
        <input type="date" id="automationDateFrom" class="filter-input" title="Desde">
        <input type="date" id="automationDateTo" class="filter-input" title="Hasta">
        <input type="text" id="automationNotifFilter" class="filter-input" placeholder="Filtrar por notificación..." style="display:none;">
    </div>
    <div class="table-container">
        <table id="automations-table">
        <thead>
            <tr>
            <th class="sortable-header" data-sort-by="name">Nombre</th>
            <th class="sortable-header" data-sort-by="lastRunTime">Última Ejecución</th>
            <th class="sortable-header" data-sort-by="scheduledTime">Próxima Ejecución</th>
            <th class="sortable-header" data-sort-by="status">Estado</th>
            <th class="sortable-header" data-sort-by="launchesJourney">Journey</th>
            <th class="sortable-header col-notif" data-sort-by="notifications.Error">Notificación Errores</th>
            <th class="sortable-header col-notif" data-sort-by="notifications.Complete">Notificación Ejecuciones</th>
            </tr>
        </thead>
        <tbody id="automations-tbody"></tbody>
        </table>
    </div>
        <div id="pagination-automations" class="pagination-controls">
        <button id="prevPageBtnAutomations" class="action-button pagination-arrow">&laquo;</button>
        <input type="number" id="pageInputAutomations" class="filter-input page-input" min="1">
        <span id="totalPagesAutomations">/ 1</span>
        <button id="nextPageBtnAutomations" class="action-button pagination-arrow">&raquo;</button>
        </div>
</div>
