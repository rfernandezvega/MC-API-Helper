<!-- Modales para gestión avanzada de Journeys (Acciones + Pausa) -->
<!-- ================================================================== -->

<!-- MODAL: ACCIONES SOBRE JOURNEYS -->
<div id="journey-actions-modal" class="modal-overlay">
    <div class="modal-content" style="width: 400px;">
        <h3>Acciones sobre Journeys</h3>
        <p id="journey-actions-message" style="font-size: 14px; margin-bottom: 25px;">
            ¿Qué acción deseas realizar sobre los journeys seleccionados?
        </p>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <button id="journey-actions-pause-btn" class="action-button">Pausar Journeys</button>
            <button id="journey-actions-resume-btn" class="action-button">Reanudar Journeys</button>
            <button id="journey-actions-stop-btn" class="action-button">Parar Journeys</button>
            <button id="journey-actions-delete-btn" class="action-button delete-btn">Borrar Journeys</button>
        </div>
        <div class="modal-actions" style="margin-top: 25px;">
            <button id="journey-actions-cancel-btn" class="action-button cancel-btn">Cancelar</button>
        </div>
    </div>
</div>

<!-- MODAL: CONFIGURACIÓN DE PAUSA -->
<div id="journey-pause-modal" class="modal-overlay">
    <div class="modal-content" style="width: 520px;">
        <h3>Pausar Journeys</h3>
        <p style="font-size: 14px; margin-bottom: 20px;">
            Vas a pausar <strong id="journey-pause-count-text">0</strong> journey(s). Configura las opciones de pausa:
        </p>
        
        <div class="form-group">
            <label title="El número de días para pausar el journey. El valor mínimo es 1 y el máximo es 14.">
                Paused Days ℹ️
            </label>
            <input type="number" id="journey-pause-days" class="filter-input" min="1" max="14" value="14" style="width: 100px;">
        </div>

        <div class="form-group">
            <label title="La acción a tomar cuando transcurran los días indicados en Paused Days.">
                Guardrail Action ℹ️
            </label>
            <select id="journey-pause-guardrail" class="filter-input">
                <option value="Resume">Resume (Reanudar)</option>
                <option value="Stop">Stop (Parar)</option>
                <option value="None">None (Nada)</option>
            </select>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center;">
            <input type="checkbox" id="journey-pause-extend" checked style="width: auto; margin-right: 10px;">
            <label for="journey-pause-extend" title="Si es 'true', la fecha de finalización de una actividad 'Wait By Duration' se extiende por los días pausados." style="margin: 0;">
                Extend Wait End Dates ℹ️
            </label>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center;">
            <input type="checkbox" id="journey-pause-process" checked style="width: auto; margin-right: 10px;">
            <label for="journey-pause-process" title="Especifica si se deben evaluar y procesar los eventos de las actividades 'Wait Until Event' durante la pausa." style="margin: 0;">
                Process Wait Until Events ℹ️
            </label>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center;">
            <input type="checkbox" id="journey-pause-retain" checked style="width: auto; margin-right: 10px;">
            <label for="journey-pause-retain" title="Si es 'true', los nuevos contactos se encolan mientras dure la pausa y entran al reanudarse el journey." style="margin: 0;">
                Retain Contact Injection ℹ️
            </label>
        </div>

        <div class="modal-actions">
            <button id="journey-pause-cancel-btn" class="action-button cancel-btn">Cancelar</button>
            <button id="journey-pause-confirm-btn" class="action-button activate-btn">Pausar Journeys</button>
        </div>
    </div>
</div>
