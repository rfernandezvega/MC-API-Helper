<!-- views/journey-analyzer.html -->
<div id="journey-analyzer-section" class="section">
    <div class="section-header">
        <button id="journeyAnalyzerBackBtn" class="back-button">← Volver a la lista</button>            
        <div class="header-actions">
            <button id="expandAllAnalyzerBtn" class="action-button secondary-btn">Expandir Todo</button>
            <button id="collapseAllAnalyzerBtn" class="action-button secondary-btn">Colapsar Todo</button>
            <button id="downloadJourneyPdfBtn" class="action-button download-btn">Generar PDF</button>
            <button id="downloadJourneyWordBtn" class="action-button download-btn">Generar Word</button>
        </div>
    </div>
    <h2>Análisis de Journey: <span id="analyzerJourneyNameTitle" class="ja-title-name"></span></h2>

    <div class="config-section-container">
        <!-- 1. Identificación y Entrada -->
        <div id="journeyAnalyzerHeaderWrapper" class="u-mb-20"></div>

        <!-- 2. Goals y Exits -->
        <div id="journeyAnalyzerGlobalWrapper" class="u-mb-20"></div>

        <!-- 3. Flujo Lógico: diagrama del journey (estilo canvas de Journey Builder).
             El flujo en texto ya no se muestra; solo se usa para el PDF y el Word. -->
        <div id="journeyAnalyzerFlowWrapper" class="u-mb-20">
            <div class="analyzer-collapsible active" id="container-flow-logic">
                <div class="analyzer-collapsible-header">
                    <span>Flujo Lógico del Journey</span>
                    <span class="analyzer-icon">▼</span>
                </div>
                <div class="analyzer-collapsible-content" style="max-height: none;">
                    <div class="ja-collapsible-inner">
                        <div class="ja-canvas-section">
                            <div class="ja-canvas-toolbar">
                                <span class="ja-canvas-hint">Clic en una actividad para ver su detalle · Ctrl + rueda para zoom · arrastra para moverte</span>
                                <div class="ja-canvas-actions">
                                    <button id="jaCanvasZoomOutBtn" class="action-button secondary-btn small-text-btn" title="Alejar">-</button>
                                    <span id="jaCanvasZoomLabel" class="ja-canvas-zoom-label">100%</span>
                                    <button id="jaCanvasZoomInBtn" class="action-button secondary-btn small-text-btn" title="Acercar">+</button>
                                    <button id="jaCanvasFitBtn" class="action-button secondary-btn small-text-btn" title="Ajustar el diagrama al espacio visible">Ajustar</button>
                                    <button id="jaCanvasDownloadBtn" class="action-button download-btn small-text-btn">Descargar imagen</button>
                                </div>
                            </div>
                            <div id="jaCanvasViewport" class="ja-canvas-viewport"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ja-section-title-row">
            <div class="u-flex-center u-gap-10">
                <span style="font-size: 1.2rem;">⚙️</span>
                <h3>Actividades del Journey</h3>
            </div>

            <!-- Aviso de actividad seleccionada en el diagrama -->
            <div id="analyzerFocusBar" class="ja-focus-bar hidden">
                <span id="analyzerFocusLabel"></span>
                <button id="analyzerShowAllActivitiesBtn" class="action-button secondary-btn small-text-btn">Ver todas</button>
            </div>

            <!-- Multipicklist de Filtrado -->
            <div class="um-filter-group" style="position:relative; margin-bottom: 0;">
                <div id="analyzerActivityTypeFilterTrigger" class="um-dropdown-trigger" style="min-width: 200px; background: var(--sf-surface);">
                    <span id="analyzerActivityTypeFilterLabel">Todos los tipos</span>
                    <span style="font-size:10px; color:var(--sf-text-muted);">▼</span>
                </div>
                <div id="analyzerActivityTypeFilterMenu" class="um-dropdown-menu" style="display:none; position:fixed; z-index: 1000;">
                    <div id="analyzerActivityTypeCheckboxList"></div>
                </div>
            </div>
        </div>
        <!-- 4. Actividades -->
        <div id="journeyAnalyzerActivitiesContainer"></div>
    </div>
</div>
