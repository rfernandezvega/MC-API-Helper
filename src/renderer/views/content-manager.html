<!-- 17. SECCIÓN: GESTOR DE CONTENIDOS -->
<div id="gestion-contenidos-section" class="section">
    <div class="section-header">
        <button class="back-button">← Atrás</button>
        <div class="header-actions">
            <button id="refreshContentBtn" class="action-button">Refrescar</button>
            <button id="exportContentCsvBtn" class="action-button">Exportar</button>
            <button id="deleteContentBtn" class="action-button delete-btn" disabled>Borrar</button>
        </div>
    </div>
    
    <div class="header-filters" style="gap: 8px;">
        <input type="text" id="contentManagerFilter" class="filter-input" placeholder="Buscar en todos los contenidos..." style="width: 280px;">
        <select id="contentUsageFilter" class="filter-input" style="width: auto;" title="Filtrar por uso">
            <option value="all">Todos</option>
            <option value="used">En uso</option>
            <option value="unused">Sin uso</option>
        </select>
        <select id="contentJourneyFilter" class="filter-input" style="width: auto;" title="Filtrar por uso en Journeys (emails, push, SMS y WhatsApp)">
            <option value="all">Journeys (todos)</option>
            <option value="in">En Journeys</option>
            <option value="out">Fuera de Journeys</option>
        </select>
        <button type="button" id="contentMissingTemplateFilter" class="filter-input" style="cursor: pointer; text-align: center; min-width: 160px; transition: all 0.2s; background-color: #f9f9f9;" title="Mostrar solo emails cuya plantilla ya no existe">
            Plantilla inexistente
        </button>
        <select id="contentDateField" class="filter-input" style="width: auto;" title="Filtrar por fecha">
            <option value="">Fecha (todos)</option>
            <option value="modifiedDate">Modificado</option>
            <option value="createdDate">Creado</option>
        </select>
        <input type="date" id="contentDateFrom" class="filter-input" style="width: auto;" title="Desde">
        <input type="date" id="contentDateTo" class="filter-input" style="width: auto;" title="Hasta">
    </div>

    <!-- Contenedor de Pestañas que se llenará dinámicamente -->
    <div class="tabs-container">
        <div id="content-manager-tab-buttons" class="tab-buttons" style="display:flex; width:100%; border-bottom:2px solid #e2e8f0;">
            <!-- tabs dinámicos van aquí -->
            <span id="content-total-count" style="font-size:0.85em; color:#999; margin-left:auto; padding:0 4px 4px 0; white-space:nowrap;"></span>
        </div>
        <div id="content-manager-tab-content"></div>
    </div>
</div>

<!-- ===================== DRAWER DE DETALLE DE CONTENIDO ===================== -->
<div id="content-detail-backdrop" class="cp-detail-backdrop"></div>
<aside id="content-detail-drawer" class="cp-detail-drawer">
    <button id="content-detail-close-btn" class="cp-detail-close-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
        <span>Cerrar</span>
    </button>
    <div class="cp-detail-header">
        <h2 id="content-detail-title">Detalle de Contenido</h2>
        <button id="content-detail-download-btn" class="action-button" title="Descargar contenido">Descargar</button>
    </div>
    <div id="content-detail-code" class="cp-detail-code-block"></div>
</aside>
